name: Golang Security Scan

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to install. Set this or go_version_file."
        required: false
        type: string
        default: ""
      go_version_file:
        description: "Path to a Go version file. Set this or go_version."
        required: false
        type: string
        default: "go.mod"
      go_cache:
        description: "Enable Go dependency caching"
        required: false
        type: boolean
        default: true

jobs:
  gosec:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v6.0.2
      
    - uses: actions/setup-go@v6.4.0
      with:
        go-version: ${{ inputs.go_version != '' && inputs.go_version || '' }}
        go-version-file: ${{ inputs.go_version == '' && inputs.go_version_file || '' }}
        cache: ${{ inputs.go_cache }}
        
    - name: Run gosec security scanner
      uses: securego/gosec@master
      with:
        args: '-fmt sarif -out results.sarif ./...'
        
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4.35.2
      if: always()
      with:
        sarif_file: results.sarif
