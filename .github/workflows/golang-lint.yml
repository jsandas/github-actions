name: Golang Linter

on:
  workflow_call:
    inputs:
      golangci_lint_version:
        description: "Version of golangci-lint to install"
        required: false
        type: string
        default: "latest"
      go_version:
        description: "Go version to install. Set this or go_version_file."
        required: false
        type: string
        default: ""
      go_version_file:
        description: "Path to a Go version file. Set this or go_version."
        required: false
        type: string
        default: "go.mod"
      go_cache:
        description: "Enable Go dependency caching"
        required: false
        type: boolean
        default: true

jobs:
  linter:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:    
    - uses: actions/checkout@v6.0.2
      
    - uses: actions/setup-go@v6.4.0
      with:
        go-version: ${{ inputs.go_version != '' && inputs.go_version || '' }}
        go-version-file: ${{ inputs.go_version == '' && inputs.go_version_file || '' }}
        cache: ${{ inputs.go_cache }}

    - uses: golangci/golangci-lint-action@v9.2.0
      with:
        version: ${{ inputs.golangci_lint_version }}

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m
        
    - name: Check gofmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then \
          echo "Code is not formatted. Please run 'gofmt -s -w .'"; \
          gofmt -s -l .; \
          exit 1; \
        fi
        echo "Code formatting is correct"
        
    - name: Check go mod
      run: |
        echo "Checking go.mod and go.sum..."
        git diff --quiet go.mod || (echo "go.mod has uncommitted changes. Please commit them first." && exit 1)
        go mod tidy
        git diff --quiet go.mod || (echo "go.mod is not tidy. Please run 'go mod tidy' and commit changes." && git diff go.mod && exit 1)
        echo "Go modules are tidy"
